app = "gantter"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_BASE_URL = "https://gantter.fly.dev"
  DATABASE_PATH = "/data/data.sqlite"
  GOOGLE_REDIRECT_URI = "https://gantter.fly.dev/api/auth/google/callback"
  PORT = "8080"
  VITE_APP_MODE = "server"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Health Check correcto dentro del servicio HTTP
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "2s"

[[mounts]]
  source = "gantter_data"
  destination = "/data"