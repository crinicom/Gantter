# fly.toml — Gantter (Fly.io)
# https://fly.io/docs/reference/configuration/

app = "gantter"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  VITE_APP_MODE = "server"
  DATABASE_PATH = "/data/data.sqlite"
  APP_BASE_URL = "https://gantter.fly.dev"
  GOOGLE_REDIRECT_URI = "https://gantter.fly.dev/api/auth/google/callback"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "gantter_data"
  destination = "/data"

[metrics]
  port = 8080
  path = "/api/health"
