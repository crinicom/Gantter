# fly.toml — Gantter (Fly.io)
# https://fly.io/docs/reference/configuration/

app = "gantter"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

  # VITE_* se leen en build-time por Vite (import.meta.env): el SPA de
  # producción debe compilarse en modo server para hablar con la API.
  [build.args]
    VITE_APP_MODE = "server"

[env]
  PORT = "8080"
  VITE_APP_MODE = "server"
  DATABASE_PATH = "/data/data.sqlite"
  APP_BASE_URL = "https://gantter.fly.dev"
  GOOGLE_REDIRECT_URI = "https://gantter.fly.dev/api/auth/google/callback"

# SQLite persistente sobre el volumen (sobrevive a redeploys)
[[mounts]]
  source = "gantter_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # siempre encendido: el SSE realtime necesita el proceso vivo
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "2s"

# Dentro de la free allowance de Fly (shared-cpu-1x 256MB)
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[metrics]
  port = 8080
  path = "/api/health"